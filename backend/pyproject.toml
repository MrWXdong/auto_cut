[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut"
version = "0.1.0"
description = "AI video production platform built around a configurable workflow engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "imageio-ffmpeg>=0.6,<1",
    "python-multipart>=0.0.9,<1",
    "yt-dlp>=2024.8",
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5",
]
asr = [
    "faster-whisper>=1.0,<2",
]

[project.scripts]
autocut = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
